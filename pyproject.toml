[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4s-rsi-demo"
version = "0.1.0"
description = "A generic demonstration scaffold for iterative AI-assisted research workflows"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ai4s-rsi = "ai4s_rsi.__main__:main"

[tool.setuptools.packages.find]
include = ["ai4s_rsi*"]
